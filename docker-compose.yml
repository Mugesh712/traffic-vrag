# Full stack for the Traffic-VRAG demo.
#
# The roadmap lists neo4j / chromadb / api / frontend. M13 answers every
# question through Gemini, a hosted LLM API -- set GEMINI_API_KEY in a .env
# file or the /query endpoint returns an error.
#
#   docker compose up -d          # start everything
#   docker compose logs -f api    # watch the pipeline
#   ./scripts/reproduce.sh        # run a real video through it
#
# GPU: this file is CPU-only so it runs anywhere. On an NVIDIA host, build the
# api image with the CUDA base (see Dockerfile) and add a `deploy.resources`
# GPU reservation to the api service.

services:
  neo4j:
    image: neo4j:5
    environment:
      # Override in a .env file rather than editing this line; the pipeline
      # reads the same value via PIPELINE__NEO4J__PASSWORD below.
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-traffic-vrag}
      # This graph is tiny (hundreds of nodes per video). 512M heap + a small
      # page cache is plenty, and on an 8GB host every 100MB left for the api
      # container matters -- Florence-2 (M5/M8) is what runs out of memory.
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-512m}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP:-512m}
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      # cypher-shell rather than a port check: the bolt port opens before the
      # database is ready to answer queries, so a port check races the loader.
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-traffic-vrag} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/data
    healthcheck:
      # The chromadb/chroma image ships no curl/wget/python, so probe the port
      # with bash's /dev/tcp instead of an HTTP client.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  api:
    build:
      context: .
      args:
        BASE_IMAGE: ${API_BASE_IMAGE:-python:3.9-slim}
    ports:
      - "8000:8000"
    environment:
      # Service hostnames replace the localhost defaults in configs/pipeline.yaml.
      # These work because env vars outrank the YAML file (fixed in M16 -- they
      # used to be silently ignored).
      PIPELINE__NEO4J__URI: bolt://neo4j:7687
      PIPELINE__NEO4J__PASSWORD: ${NEO4J_PASSWORD:-traffic-vrag}
      PIPELINE__VECTOR_STORE__MODE: http
      PIPELINE__VECTOR_STORE__HOST: chromadb
      PIPELINE__VECTOR_STORE__PORT: "8000"
      PIPELINE__ANSWER__MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      PIPELINE__ANSWER__GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # 60s is generous for a hosted API call (no cold-start/model-load cost
      # like the old local-inference backend had); raise only if seeing
      # timeouts in practice.
      PIPELINE__ANSWER__TIMEOUT_SEC: ${ANSWER_TIMEOUT_SEC:-60.0}
      # --- CPU-only speed tuning (M5/M8 Florence-2 dominate runtime) ---
      # Defaults here reproduce configs/pipeline.yaml; the .env on a CPU-only
      # host lowers them. Accuracy cost is real: fewer samples and greedy
      # decoding push more attributes to "uncertain" rather than wrong, which
      # is the tradeoff this project already prefers.
      PIPELINE__VLM__NUM_BEAMS: ${VLM_NUM_BEAMS:-3}
      PIPELINE__VLM__FRAMES_PER_TRACK: ${VLM_FRAMES_PER_TRACK:-8}
      PIPELINE__VLM__MAX_NEW_TOKENS: ${VLM_MAX_NEW_TOKENS:-200}
      # Crops fed to Florence-2 at once. This is the main lever on *peak*
      # memory during M5/M8 (weights are fixed ~1.8GB; activations scale with
      # the batch). Drop to 1-2 in .env on a memory-tight host.
      PIPELINE__VLM__BATCH_SIZE: ${VLM_BATCH_SIZE:-8}
      PIPELINE__CONFIRMATION__TOP_K: ${CONFIRM_TOP_K:-3}
      # The UI is reached at the host's public address, not localhost, so that
      # origin must be allowed explicitly -- the default list is dev-only, and
      # a wildcard is not an option with allow_credentials=True.
      PIPELINE__API__CORS_ORIGINS: ${PUBLIC_CORS_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173"]}
      # --- Job store ---------------------------------------------------------
      # Default: the built-in SQLite file store, nothing external. To use
      # DynamoDB instead, set JOBS_BACKEND=dynamodb and provide AWS credentials
      # (put the block from your AWS console into .env), or run
      #   docker compose --profile aws up
      # which also starts a local DynamoDB (localstack) and points the API at it
      # via AWS_ENDPOINT_URL below.
      PIPELINE__API__JOBS_BACKEND: ${JOBS_BACKEND:-sqlite}
      PIPELINE__API__JOBS_TABLE_NAME: ${JOBS_TABLE_NAME:-traffic-vrag-jobs}
      # Artifact store: "local" writes pipeline outputs to the ./data bind mount
      # (default); "s3" writes them to s3://<STORAGE_S3_BUCKET>/<prefix>/...
      # Raw uploads, clip .mp4s, the job DB and the Chroma dir stay local either
      # way. `docker compose --profile aws up` points this at localstack S3.
      PIPELINE__STORAGE__BACKEND: ${STORAGE_BACKEND:-local}
      PIPELINE__STORAGE__S3_BUCKET: ${STORAGE_S3_BUCKET:-}
      PIPELINE__STORAGE__S3_PREFIX: ${STORAGE_S3_PREFIX:-traffic-vrag}
      PIPELINE__AWS__REGION: ${AWS_REGION:-}
      PIPELINE__AWS__ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      # boto3 reads these from the environment. Empty on the SQLite path, which
      # never constructs an AWS client.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    volumes:
      # Pipeline artefacts live on the host so they survive `compose down` and
      # can be inspected/committed without entering a container.
      - ./data:/app/data
      - ./configs:/app/configs
      # Model weights: ~1GB+ of downloads that must not repeat per rebuild.
      - model_cache:/models
      # ChromaDB's default embedding function (M11) downloads a ~79MB
      # all-MiniLM-L6-v2 ONNX model here on first use. Without this volume it
      # re-downloads on every `compose up` recreate -- minutes on a slow link.
      - chroma_onnx_cache:/root/.cache/chroma
    depends_on:
      neo4j:
        condition: service_healthy
      chromadb:
        condition: service_healthy

  # Local stand-in for DynamoDB + S3, started only with `--profile aws`. To use
  # it, put this in .env and run `docker compose --profile aws up`:
  #   AWS_ENDPOINT_URL=http://localstack:4566
  #   AWS_REGION=us-east-1
  #   AWS_ACCESS_KEY_ID=test
  #   AWS_SECRET_ACCESS_KEY=test
  #   JOBS_BACKEND=dynamodb          # optional: DynamoDB job store
  #   STORAGE_BACKEND=s3             # optional: S3 artifact store
  #   STORAGE_S3_BUCKET=traffic-vrag-artifacts
  # then create the bucket once:
  #   docker compose exec localstack awslocal s3 mb s3://traffic-vrag-artifacts
  localstack:
    image: localstack/localstack:3
    profiles: ["aws"]
    ports:
      - "4566:4566"
    environment:
      SERVICES: dynamodb,s3
    volumes:
      - localstack_data:/var/lib/localstack

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      # Reached from the user's BROWSER, not from inside the compose network,
      # so this is never the `api` service name. localhost is right only when
      # the browser runs on the same host; a remote deploy must override this
      # with the public address, or the browser resolves it to its own machine.
      VITE_API_BASE_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - api

volumes:
  neo4j_data:
  chroma_data:
  model_cache:
  chroma_onnx_cache:
  localstack_data:
