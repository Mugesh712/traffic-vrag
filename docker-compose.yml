# Full stack for the Traffic-VRAG demo.
#
# The roadmap lists neo4j / chromadb / api / frontend. M13 answers every
# question through Gemini, a hosted LLM API -- set GEMINI_API_KEY in a .env
# file or the /query endpoint returns an error.
#
#   docker compose up -d          # start everything
#   docker compose logs -f api    # watch the pipeline
#   ./scripts/reproduce.sh        # run a real video through it
#
# GPU: this file is CPU-only so it runs anywhere. On an NVIDIA host, build the
# api image with the CUDA base (see Dockerfile) and add a `deploy.resources`
# GPU reservation to the api service.

services:
  neo4j:
    image: neo4j:5
    environment:
      # Override in a .env file rather than editing this line; the pipeline
      # reads the same value via PIPELINE__NEO4J__PASSWORD below.
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-traffic-vrag}
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      # cypher-shell rather than a port check: the bolt port opens before the
      # database is ready to answer queries, so a port check races the loader.
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-traffic-vrag} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/data
    healthcheck:
      # The chromadb/chroma image ships no curl/wget/python, so probe the port
      # with bash's /dev/tcp instead of an HTTP client.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  api:
    build:
      context: .
      args:
        BASE_IMAGE: ${API_BASE_IMAGE:-python:3.9-slim}
    ports:
      - "8000:8000"
    environment:
      # Service hostnames replace the localhost defaults in configs/pipeline.yaml.
      # These work because env vars outrank the YAML file (fixed in M16 -- they
      # used to be silently ignored).
      PIPELINE__NEO4J__URI: bolt://neo4j:7687
      PIPELINE__NEO4J__PASSWORD: ${NEO4J_PASSWORD:-traffic-vrag}
      PIPELINE__VECTOR_STORE__MODE: http
      PIPELINE__VECTOR_STORE__HOST: chromadb
      PIPELINE__VECTOR_STORE__PORT: "8000"
      PIPELINE__ANSWER__MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      PIPELINE__ANSWER__GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # 60s is generous for a hosted API call (no cold-start/model-load cost
      # like the old local-inference backend had); raise only if seeing
      # timeouts in practice.
      PIPELINE__ANSWER__TIMEOUT_SEC: ${ANSWER_TIMEOUT_SEC:-60.0}
      # --- CPU-only speed tuning (M5/M8 Florence-2 dominate runtime) ---
      # Defaults here reproduce configs/pipeline.yaml; the .env on a CPU-only
      # host lowers them. Accuracy cost is real: fewer samples and greedy
      # decoding push more attributes to "uncertain" rather than wrong, which
      # is the tradeoff this project already prefers.
      PIPELINE__VLM__NUM_BEAMS: ${VLM_NUM_BEAMS:-3}
      PIPELINE__VLM__FRAMES_PER_TRACK: ${VLM_FRAMES_PER_TRACK:-8}
      PIPELINE__VLM__MAX_NEW_TOKENS: ${VLM_MAX_NEW_TOKENS:-200}
      PIPELINE__CONFIRMATION__TOP_K: ${CONFIRM_TOP_K:-3}
      # The UI is reached at the host's public address, not localhost, so that
      # origin must be allowed explicitly -- the default list is dev-only, and
      # a wildcard is not an option with allow_credentials=True.
      PIPELINE__API__CORS_ORIGINS: ${PUBLIC_CORS_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173"]}
    volumes:
      # Pipeline artefacts live on the host so they survive `compose down` and
      # can be inspected/committed without entering a container.
      - ./data:/app/data
      - ./configs:/app/configs
      # Model weights: ~1GB+ of downloads that must not repeat per rebuild.
      - model_cache:/models
    depends_on:
      neo4j:
        condition: service_healthy
      chromadb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      # Reached from the user's BROWSER, not from inside the compose network,
      # so this is never the `api` service name. localhost is right only when
      # the browser runs on the same host; a remote deploy must override this
      # with the public address, or the browser resolves it to its own machine.
      VITE_API_BASE_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - api

volumes:
  neo4j_data:
  chroma_data:
  model_cache:
