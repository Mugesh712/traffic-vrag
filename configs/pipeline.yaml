# Central pipeline configuration. Every module reads its thresholds from here
# via src/utils/config.py — no thresholds should be hardcoded in module code.

paths:
  data_dir: data
  raw_dir: data/raw
  clips_dir: data/clips
  frames_dir: data/frames
  crops_dir: data/crops
  outputs_dir: data/outputs

ingest:
  clip_length_sec: 30
  frame_sample_interval_sec: 1.0

detect:
  # nano/small underperform badly on real elevated/near-nadir traffic-camera
  # footage -- see the comment in src/utils/config.py's DetectConfig for the
  # measured recall numbers (yolo11m still <50% frame recall; this is a known,
  # unresolved viewpoint domain-gap, not a threshold-tuning issue).
  model_path: yolo11m.pt
  conf_threshold: 0.25
  iou_threshold: 0.45
  classes:
    - car
    - truck
    - bus
    - motorcycle
    - bicycle
    - person
  device: auto

track:
  tracker: bytetrack
  track_activation_threshold: 0.25
  lost_track_buffer_frames: 30
  minimum_matching_threshold: 0.8
  minimum_consecutive_frames: 1
  reid_model: osnet_x0_25
  reid_device: auto
  embedding_ema_alpha: 0.9
  embedding_top_k: 5

association:
  # M4 hard gates. All must hold for a fragment link to be accepted.
  # tau_app: min ReID cosine similarity. NOTE: needs calibration on real
  # footage — ImageNet-pretrained OSNet scores ~0.72 even between visually
  # distinct objects, so 0.7 is close to the noise floor. Sweep it in M16.
  appearance_similarity_threshold: 0.7
  max_gap_sec: 3.0                       # temporal gate; seconds, so it is
                                         # independent of the frame sampling rate
  stationary_variance_threshold: 5.0     # px^2; below this a track is "stationary"
  stationary_iou_threshold: 0.3          # tau_iou, used for stationary pairs
  motion_tolerance: 2.5                  # max prediction error, in object diagonals
  velocity_window: 3                     # frames averaged for exit velocity
  score_weights:                         # ranking only; never admits a gated-out pair
    appearance: 0.5
    motion: 0.3
    temporal: 0.2

vlm:
  backend: florence2
  model_id: microsoft/Florence-2-base
  device: auto              # cuda if available else cpu; never mps (see config.py)
  max_new_tokens: 200
  num_beams: 3
  batch_size: 8
  frames_per_track: 8
  cache_dir: data/outputs/vlm_cache
  quality_reference_size_px: 96.0       # crop at/above this scores 1.0 for size
  quality_reference_sharpness: 200.0    # Laplacian variance scoring 1.0

voting:
  # M6 confidence-weighted majority voting.
  confidence_margin_threshold: 0.15   # winner must beat runner-up by this share
  min_evidence_count: 3               # fewer supporting observations -> uncertain
  retry_confidence: 0.6               # weight for values only the retry caption found

linking:
  # M7 cross-clip hard gates: CLASS -> SEMANTIC -> MOTION -> APPEARANCE.
  appearance_similarity_threshold: 0.75
  # Clips are contiguous, so a real cross-boundary link spans ~one frame
  # interval. A large budget would bless tracks that vanished mid-clip.
  max_gap_sec: 5.0
  motion_tolerance: 3.0       # prediction error, in object diagonals
  velocity_window: 3          # frames averaged for exit velocity
  max_clip_distance: 1        # adjacent clips only; see config.py
  enable_semantic_gate: true  # M16 ablation switch
  enable_appearance_gate: true
  score_weights:              # ranking only; never admits a gated-out pair
    appearance: 0.4
    motion: 0.3
    semantic: 0.3

confirmation:
  # M8 global best-shot confirmation.
  top_k: 3                          # best shots re-read with the high-detail prompt
  quality_reference_size_px: 128.0
  quality_reference_sharpness: 200.0
  viewpoint_weight: 0.5             # 0 disables the frontality preference entirely
  frontal_aspect_ratio: 1.2         # w/h at or below this reads as frontal
  side_aspect_ratio: 2.2            # at or above this reads as side-on
  min_evidence_count: 1             # one excellent crop is evidence here
  confidence_margin_threshold: 0.15
  confidence_boost: 0.1             # best shot agrees with clip-level voting
  disagreement_penalty: 0.2         # clip-level overrules the best shot

events:
  # M9 rule-based event detection. Thresholds are px/sec and seconds, applied
  # to each global object's stitched, real-timestamp trajectory.
  stop_speed_threshold_px_s: 5.0
  stop_min_duration_sec: 2.0
  moving_speed_threshold_px_s: 8.0    # heading is only trusted above this speed
  turn_min_degrees: 45.0
  turn_min_window_sec: 0.5            # guards against single-sample noise
  turn_max_window_sec: 8.0
  lane_change_min_lateral_px: 40.0
  lane_change_max_heading_deg: 20.0   # heading must stay roughly constant
  lane_change_min_window_sec: 0.5
  lane_change_max_window_sec: 6.0
  overtake_max_heading_diff_deg: 30.0 # "same direction" gate
  overtake_min_lateral_px: 15.0       # "lateral displacement present" gate
  overtake_min_sustain_sec: 1.0
  overtake_max_window_sec: 15.0
  max_evidence_frames: 5
  regions_dir: configs/regions        # per-video line/region YAML, optional

neo4j:
  # M10 knowledge graph. Override the password out of band:
  #   export PIPELINE__NEO4J__PASSWORD=...
  uri: bolt://localhost:7687
  user: neo4j
  password: traffic-vrag
  database: neo4j
  batch_size: 1000

vector_store:
  # M11 ChromaDB vector store.
  persist_dir: data/outputs/vector_store
  object_collection: object_timelines
  event_collection: events

retrieval:
  # M12 hybrid retrieval.
  top_k: 5
  vector_candidates: 20
  graph_limit: 50
  rrf_k: 60                  # Reciprocal Rank Fusion constant
  reasoning_widen_factor: 2  # counterfactual/forecast need context, not one best match
  intent_backend: rules      # "rules" | "llm" (M13 supplies the LLM backend)

retrieval_weights:
  # All three terms are normalized to [0,1] before weighting.
  vector: 0.5        # graded semantic relevance
  graph: 0.35        # exact constraint satisfaction, authoritative
  confidence: 0.15   # the system's own certainty in the matched attributes

answer:
  # M13 LLM reasoning & explainable answer generation.
  backend: ollama
  model: qwen2.5:7b
  host: http://localhost:11434
  timeout_sec: 60.0
  temperature: 0.1        # grounded factual answering, not creative generation
  max_context_objects: 8
  max_events_per_object: 5

api:
  # M14 FastAPI backend.
  host: 0.0.0.0
  port: 8000
  db_path: data/outputs/jobs.db
  cors_origins:
    - http://localhost:3000
    - http://localhost:5173
    - http://127.0.0.1:3000
    - http://127.0.0.1:5173
  max_upload_mb: 2048

logging:
  level: INFO
  log_dir: data/outputs/logs
